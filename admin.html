<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font-family:Arial;background:#111;color:#fff;padding:15px}.box{max-width:400px;margin:30px auto;background:#222;padding:20px;border-radius:10px}input,button{width:100%;padding:12px;margin:8px 0;border-radius:6px;border:none;box-sizing:border-box}button{background:#ff9800;font-weight:bold}</style></head><body><div class="box" id="loginBox"><h3>Admin Login</h3><input type="password" id="pass" placeholder="Password"><button onclick="checkPass()">Login</button><p id="msg"></p></div><div class="box" id="uploadBox" style="display:none"><h3>Add Photo</h3><input type="file" id="fileInput" accept="image/*"><input type="text" id="pat" placeholder="GitHub Token"><button onclick="upload()">Upload</button><p id="status"></p></div><script>const MY_PASSWORD="Wellington@2024";const OWNER="WellingtonCSpainters";const REPO="wellingtoncspainters.github.io";const FOLDER="images/work";function checkPass(){if(document.getElementById('pass').value===MY_PASSWORD){loginBox.style.display='none';uploadBox.style.display='block';if(localStorage.getItem('gh_pat'))pat.value=localStorage.getItem('gh_pat')}else msg.innerText="Wrong password"}async function upload(){const file=fileInput.files[0];const patVal=pat.value.trim();if(!file||!patVal){alert('Select image + token');return}localStorage.setItem('gh_pat',patVal);status.innerText="Uploading...";const reader=new FileReader();reader.onload=async()=>{const base64=reader.result.split(',')[1];const name=Date.now()+"-"+file.name.replace(/\s/g,'-');const url=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}/${name}`;const res=await fetch(url,{method:'PUT',headers:{'Authorization':`token ${patVal}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Add ${name}`,content:base64})});status.innerText=res.ok?"✅ Done! Live in 1 min":"Error: "+await res.text()};reader.readAsDataURL(file)}</script></body></html>
